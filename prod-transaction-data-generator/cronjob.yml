apiVersion: batch/v1
kind: CronJob
metadata:
  name: prod-transaction-data-generator
spec:
  schedule: "*/60 * * * *"          # every 1 hour
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: generator
              image: 565950323291.dkr.ecr.eu-central-1.amazonaws.com/prod-transaction-data-generator:latest
              envFrom:
                - secretRef:
                    name: fraud-db   # DB_HOST, DB_PORT, DB_NAME, DB_USER, DB_PASSWORD
              env:
                - name: BATCH_SIZE
                  value: "500"
                - name: WINDOW_MINUTES
                  value: "5"
                - name: FRAUD_RATE
                  value: "0.02"
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 128Mi