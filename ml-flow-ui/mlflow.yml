apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
        - name: mlflow
          image: ghcr.io/mlflow/mlflow:v2.22.0
          command: ["sh", "-c"]
          args:
            - >-
              pip install --no-cache-dir psycopg2-binary boto3 &&
              exec mlflow server
              --host 0.0.0.0 --port 5000
              --backend-store-uri "$BACKEND_URI"
              --artifacts-destination "$ARTIFACT_URI"
              --serve-artifacts
          envFrom:
            - secretRef:
                name: mlflow-secrets    # BACKEND_URI, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
          env:
            - name: ARTIFACT_URI
              value: s3://real-time-fraud-detection-data-565950323291/mlflow-artifacts
            - name: AWS_DEFAULT_REGION
              value: eu-central-1
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 40
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
spec:
  type: LoadBalancer
  selector:
    app: mlflow
  ports:
    - port: 5000
      targetPort: 5000